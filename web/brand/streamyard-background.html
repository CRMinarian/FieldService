<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="./brand-kit.css">
<style>
html,body{margin:0}
.bg{width:1920px;height:1080px;position:relative;overflow:hidden;
   background:
     radial-gradient(80% 100% at 50% 30%, rgba(53,58,50,.9) 0%, transparent 60%),
     linear-gradient(165deg,#242A24 0%,#1D231E 55%,#141812 100%);}
.bg::before{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:160px 160px;opacity:.10;mix-blend-mode:overlay;}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(240,237,230,.05) 1.5px, transparent 1.5px);background-size:44px 44px;}
.wmk{position:absolute;font-family:var(--f-wm);font-size:620px;line-height:1;color:#000;opacity:.06;right:-60px;bottom:-180px;text-transform:uppercase;}
.haz{position:absolute;top:0;left:0;right:0;height:16px;background:var(--hazard);}
.rule{position:absolute;top:16px;left:0;right:0;height:5px;background:var(--orange);}
.haz2{position:absolute;bottom:0;left:0;right:0;height:16px;background:var(--hazard);}
.rule2{position:absolute;bottom:16px;left:0;right:0;height:5px;background:var(--orange);}
</style>
<div class="bg"><div class="dots"></div><div class="wmk">NERD</div>
<div class="haz"></div><div class="rule"></div><div class="haz2"></div><div class="rule2"></div></div>
