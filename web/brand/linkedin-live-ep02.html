<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>FSN LinkedIn Live | EP02 Live | 1280x720</title>
<link rel="stylesheet" href="./brand-kit.css">
<style>
  html,body{margin:0;background:#111;}
  .t{width:1280px;height:720px;position:relative;overflow:hidden;color:var(--bone);
     background:
       radial-gradient(70% 90% at 80% 42%, rgba(240,130,74,.12) 0%, transparent 55%),
       linear-gradient(160deg,#242A24 0%,#1D231E 50%,#151812 100%);}
  .t::before{content:"";position:absolute;inset:0;background-image:var(--grain);background-size:150px 150px;opacity:.09;mix-blend-mode:overlay;z-index:1;pointer-events:none;}
  .haz{position:absolute;top:0;left:0;right:0;height:12px;background:var(--hazard);z-index:4;}
  .rule{position:absolute;top:12px;left:0;right:0;height:4px;background:var(--orange);z-index:4;}
  .mast{position:absolute;top:38px;left:52px;font-family:var(--f-wm);text-transform:uppercase;font-size:26px;color:#FFF;z-index:6;}
  .mast b{color:#FF9A3D;}
  .livebadge{position:absolute;top:34px;right:44px;z-index:6;font-family:var(--f-mono);font-size:22px;letter-spacing:.18em;color:#FFD23F;border:3px solid #FFD23F;border-radius:8px;padding:8px 18px;background:rgba(0,0,0,.35);}
  .livebadge .dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#FF5A1F;margin-right:10px;}
  /* face right, patch border (locked YT treatment) */
  .glow{position:absolute;right:-30px;top:-40px;width:640px;height:820px;z-index:2;
     background:radial-gradient(55% 50% at 55% 45%, rgba(240,130,74,.32), rgba(227,107,44,.10) 55%, transparent 75%);}
  .facewrap{position:absolute;right:26px;top:96px;width:470px;height:560px;z-index:5;transform:rotate(1.4deg);
     border-radius:12px;padding:11px;background:repeating-conic-gradient(#ff8d33 0deg .35deg,#d05f0e .35deg .7deg);
     box-shadow:0 24px 48px rgba(0,0,0,.6);}
  .face{width:100%;height:100%;border-radius:7px;overflow:hidden;border:2px solid rgba(0,0,0,.35);background:var(--panel);}
  .face img{width:190%;height:auto;margin-left:-48%;margin-top:-6%;display:block;filter:contrast(1.12) saturate(1.08) brightness(1.04);}
  .tape{position:absolute;height:40px;z-index:8;background:
       linear-gradient(90deg, rgba(227,107,44,.9) 0 12px, transparent 12px),
       linear-gradient(270deg, rgba(227,107,44,.9) 0 12px, transparent 12px), #FFD23F;
     opacity:.97;box-shadow:0 4px 10px rgba(0,0,0,.4);}
  .tape.tl{width:180px;right:400px;top:120px;transform:rotate(22deg);}
  .tape.br{width:160px;right:-40px;bottom:120px;transform:rotate(-30deg);}
  /* left text block */
  .left{position:absolute;left:52px;top:150px;width:740px;z-index:6;}
  .eyebrow{font-family:var(--f-mono);font-size:24px;letter-spacing:.30em;color:var(--steel, #9FB0BC);text-transform:uppercase;margin-bottom:22px;}
  .eyebrow b{color:#FFD23F;}
  h1{font-family:var(--f-osw),'Oswald',sans-serif;font-weight:700;text-transform:uppercase;margin:0;line-height:1.0;
     font-size:62px;color:#FFF;text-shadow:0 6px 0 rgba(0,0,0,.6);}
  h1 .o{color:#FF9A3D;}
  .meta{margin-top:34px;display:flex;align-items:center;gap:20px;}
  .datechip{font-family:var(--f-mono);font-size:22px;white-space:nowrap;letter-spacing:.10em;background:#4A6B8A;color:#FFF;padding:12px 22px;border-radius:6px;}
  .host{font-family:var(--f-osw),sans-serif;font-weight:700;font-size:28px;text-transform:uppercase;color:var(--bone);}
  .site{position:absolute;left:52px;bottom:36px;font-family:var(--f-mono);font-size:22px;letter-spacing:.22em;color:rgba(237,230,214,.6);z-index:6;}
</style></head><body>
<div class="t">
  <div class="haz"></div><div class="rule"></div>
  <div class="mast">Field Service <b>Nerd</b> <span style="color:#FF9A3D">// LIVE</span></div>
  <div class="livebadge"><span class="dot"></span>LIVE</div>
  <div class="glow"></div>
  <div class="facewrap"><div class="face"><img src="../assets/pierre-headshot.jpg" alt=""></div></div>
  <div class="tape tl"></div><div class="tape br"></div>
  <div class="left">
    <div class="eyebrow"><b>Field Service LIVE</b> · Episode 02</div>
    <h1>What I <span class="o">Wish I Knew</span><br>Before My First Project</h1>
    <div class="meta">
      <span class="datechip">FRI · AUG 14 · 11:00 AM ET</span>
      <span class="host">Pierre Hulsebus</span>
    </div>
  </div>
  <div class="site">FIELDSERVICENERD.COM</div>
</div></body></html>
