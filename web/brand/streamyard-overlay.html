<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="./brand-kit.css">
<style>
html,body{margin:0;background:transparent}
.ov{width:1920px;height:1080px;position:relative;overflow:hidden;background:transparent;}
.mast{position:absolute;top:26px;left:44px;font-family:var(--f-wm);text-transform:uppercase;font-size:34px;color:#FFF;
   text-shadow:0 3px 8px rgba(0,0,0,.7);}
.mast b{color:#FF9A3D;}
.livebadge{position:absolute;top:24px;right:40px;font-family:var(--f-mono);font-size:24px;letter-spacing:.18em;color:#FFD23F;

.livebadge .dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#FF5A1F;margin-right:10px;}
.bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:rgba(20,24,18,.88);border-top:4px solid var(--orange);
   display:flex;align-items:center;justify-content:space-between;padding:0 44px;}
.site{font-family:var(--f-mono);font-size:24px;letter-spacing:.24em;color:var(--bone);}
.tag{font-family:var(--f-osw),sans-serif;font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.08em;color:#FF9A3D;}
</style>
<div class="ov">
  <div class="mast">Field Service <b>Nerd</b> <span style="color:#FF9A3D">// LIVE</span></div>
  <div class="livebadge"><span class="dot"></span>LIVE</div>
