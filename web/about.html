<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Pierre Hulsebus | Field Service Nerd</title>
<meta name="description" content="Pierre Hulsebus | 30+ years in enterprise field service, former Microsoft Director and Global Black Belt for Dynamics 365 Field Service. The practitioner behind Field Service Nerd.">
<meta property="og:title" content="About Pierre Hulsebus | Field Service Nerd">
<meta property="og:description" content="30 years in field service. Ex-Microsoft Global Black Belt for D365 Field Service. Putting the real playbook online.">
<meta property="og:image" content="https://fieldservicenerd.com/assets/fsn-logo-social.png">

<link rel="apple-touch-icon" href="assets/fsn-logo-avatar.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('fsn-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="_ds.jsx?v=4"></script>
  <script type="text/babel" src="Nav.jsx?v=4"></script>
  <script type="text/babel" src="About.jsx?v=4"></script>
  <script type="text/babel" src="Sections.jsx?v=4"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [theme, setTheme] = React.useState(
        () => (document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark')
      );
      React.useEffect(() => {
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('fsn-theme', theme); } catch (e) {}
      }, [theme]);
      React.useEffect(() => {
        const check = () => document.querySelectorAll('.draw-rule:not(.in-view)').forEach((el) => {
          const r = el.getBoundingClientRect();
          if (r.top < window.innerHeight * 0.88 && r.bottom > 0) el.classList.add('in-view');
        });
        check();
        const t = setTimeout(check, 120);
        window.addEventListener('scroll', check, { passive: true });
        return () => { clearTimeout(t); window.removeEventListener('scroll', check); };
      }, []);
      const { Nav, AboutHero, AboutCredentials, AboutBio, AboutConnect, Footer } = window;
      return (
        <React.Fragment>
          <Nav theme={theme} onToggleTheme={() => setTheme((t) => (t === 'light' ? 'dark' : 'light'))} />
          <AboutHero />
          <AboutCredentials />
          <AboutBio />
          <AboutConnect />
          <Footer />
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
