<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Service Nerd — Dynamics 365 Field Service, Decoded</title>
<meta name="description" content="The knowledge base, podcast, and field notes for people who run Dynamics 365 Field Service. AI, scheduling, RSO, IoT, and Copilot architecture from a 30-year practitioner and ex-Microsoft Field Service Global Black Belt.">
<meta property="og:title" content="Field Service Nerd — Dynamics 365 Field Service, Decoded">
<meta property="og:description" content="Knowledge base, podcast, and consulting for the people who run D365 Field Service. Free AI primer + field notes.">
<meta property="og:image" content="https://fieldservicenerd.com/assets/fsn-youtube-channel-art.png">
<meta property="og:url" content="https://fieldservicenerd.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://fieldservicenerd.com/">
<link rel="icon" href="assets/fsn-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="app.css">
<script>
  // Theme bootstrap — dark (control-room) is the default reading experience.
  (function () {
    try {
      var t = localStorage.getItem('fsn-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="_ds.jsx?v=1"></script>
  <script type="text/babel" src="Nav.jsx?v=1"></script>
  <script type="text/babel" src="Hero.jsx?v=1"></script>
  <script type="text/babel" src="Sections.jsx?v=2"></script>

  <script type="text/babel" data-presets="react">
    function App() {
      const [toast, setToast] = React.useState(false);
      const [theme, setTheme] = React.useState(
        () => (document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark')
      );
      React.useEffect(() => {
        if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        try { localStorage.setItem('fsn-theme', theme); } catch (e) {}
      }, [theme]);
      const toggleTheme = () => setTheme((t) => (t === 'light' ? 'dark' : 'light'));

      // Self-drawing signal rules — draw themselves when scrolled into view.
      React.useEffect(() => {
        const check = () => {
          document.querySelectorAll('.draw-rule:not(.in-view)').forEach((el) => {
            const r = el.getBoundingClientRect();
            if (r.top < window.innerHeight * 0.88 && r.bottom > 0) el.classList.add('in-view');
          });
        };
        check();
        const t = setTimeout(check, 120);
        window.addEventListener('scroll', check, { passive: true });
        window.addEventListener('resize', check);
        return () => { clearTimeout(t); window.removeEventListener('scroll', check); window.removeEventListener('resize', check); };
      }, []);

      const join = (e) => { if (e) e.preventDefault(); document.getElementById('join').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
      const { Nav, Hero, TrustBar, Pillars, LeadMagnet, Podcast, Videos, ConsultingTeaser, EmailSection, Faq, Footer } = window;
      return (
        <React.Fragment>
          <Nav onJoin={join} theme={theme} onToggleTheme={toggleTheme} />
          <Hero onJoin={join} />
          <TrustBar />
          <Pillars />
          <LeadMagnet onJoin={join} />
          <Podcast />
          <Videos />
          <ConsultingTeaser />
          <EmailSection />
          <Faq />
          <Footer />
          {toast && <div className="toast"><span className="status-dot"></span> Welcome aboard — check your email.</div>}
        </React.Fragment>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
